# BIOS start only: on UEFI the medium starts through IFelxBoot
set timeout=3
set default=0

insmod all_video
insmod gfxterm
insmod png

if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=auto
    terminal_output gfxterm
fi

# Hand the graphics mode to the kernel so simpledrm can provide /dev/dri/card0
set gfxpayload=keep

menuentry "ODE Installer" {
    linux /boot/vmlinuz rdinit=/init quiet loglevel=3
    initrd /boot/initrd.img
}

menuentry "ODE Installer (safe graphics)" {
    linux /boot/vmlinuz rdinit=/init nomodeset quiet loglevel=3
    initrd /boot/initrd.img
}

menuentry "ODE Installer (debug shell)" {
    linux /boot/vmlinuz rdinit=/init ode.debug=1 loglevel=7
    initrd /boot/initrd.img
}
